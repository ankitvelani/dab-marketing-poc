# Facebook Ads bronze ingestion job

resources:
  jobs:
    facebook_ads:
      name: facebook_ads

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: "/Volumes/source/raw/datasets/Facebook/"
          min_time_between_triggers_seconds: 120
          wait_after_last_change_seconds: 300

      tasks:
        - task_key: facebook_ads
          for_each_task:
            inputs: >-
              [
                "facebook_ads__account_report",
                "facebook_ads__ad_report",
                "facebook_ads__ad_set_report",
                "facebook_ads__campaign_report",
                "facebook_ads__country_report"
              ]
            concurrency: 1

            task:
              task_key: facebook_ads_iteration
              notebook_task:
                notebook_path: ../src/facebook_ads_to_bronze.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${var.schema}
                  datasets: "{{input}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

      tags:
        source: "FACEBOOK_ADS_BRONZE"