# A sample job for marketing.

resources:
  jobs:
    facebook_ads:
      name: facebook_ads

      # trigger:
      #   # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
      #   periodic:
      #     interval: 1
      #     unit: DAYS
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: "/Volumes/source/raw/datasets/Facebook/facebook_ads__account_report/"
          min_time_between_triggers_seconds: 120
          wait_after_last_change_seconds: 300

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: facebook_ads
          for_each_task:
            # Single source of truth for which entities exist. Add/remove an
            # entity here only - no Python changes needed. Each entity below
            # runs as its own independent task run (own status, own retry) -
            # one entity failing does not block or skip the others.
            inputs: >-
              ["facebook_ads__account_report",
               "facebook_ads__campaign_report",
               "facebook_ads__ad_set_report",
               "facebook_ads__ad_report",
               "facebook_ads__country_report"]
            concurrency: 4
            task:
              task_key: facebook_ads_entity_ingest
              notebook_task:
                notebook_path: ../src/facebook_ads.py
                base_parameters:
                  catalog: "{{job.parameters.catalog}}"
                  schema: "{{job.parameters.schema}}"
                  entity: "{{input}}"
              max_retries: 2
              min_retry_interval_millis: 60000

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

      tags:
        source: "FACEBOOK_ADS_BRONZE"
