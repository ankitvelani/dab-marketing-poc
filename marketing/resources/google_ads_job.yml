# A sample job for marketing.

resources:
  jobs:
    google_ads:
      name: google_ads

      # trigger:
      #   # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
      #   periodic:
      #     interval: 1
      #     unit: DAYS
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: "/Volumes/source/raw/datasets/Google_Ads/"
          min_time_between_triggers_seconds: 120
          wait_after_last_change_seconds: 300

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: google_ads
          notebook_task:
            notebook_path: ../src/google_ads.py

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

      tags:
        source: "GOOGLE_ADS_BRONZE"
