# Google Ads bronze ingestion job

resources:
  jobs:
    google_ads:
      name: google_ads

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: "/Volumes/source/raw/datasets/Google_Ads/"
          min_time_between_triggers_seconds: 120
          wait_after_last_change_seconds: 300

      tasks:
        - task_key: google_ads
          for_each_task:
            inputs: >-
              [
                "google_ads__account_report",
                "google_ads__ad_group_report",
                "google_ads__ad_report",
                "google_ads__campaign_report",
                "google_ads__keyword_report",
                "google_ads__search_term_report",
                "google_ads__url_report"
              ]
            concurrency: 1

            task:
              task_key: google_ads_iteration
              notebook_task:
                notebook_path: ../src/google_ads_to_bronze.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${var.schema}
                  datasets: "{{input}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

      tags:
        source: "GOOGLE_ADS_BRONZE"