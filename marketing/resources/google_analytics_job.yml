# A sample job for marketing.

resources:
  jobs:
    google_analytics:
      name: google_analytics

      schedule:
        quartz_cron_expression: 47 0 1 * * ?
        timezone_id: Asia/Calcutta
        pause_status: UNPAUSED

      email_notifications:
       on_failure:
         - ankit.velani@gmail.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: google_analytics
          notebook_task:
            notebook_path: ../src/google_analytics_to_bronze.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

      tags:
        source: "GA4_BRONZE"
        jobName: "Google Analytics Ingestion"
