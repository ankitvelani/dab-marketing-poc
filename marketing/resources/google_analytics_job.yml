# A sample job for marketing.

resources:
  jobs:
    google_analtyics:
      name: google_analtyics

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: google_analytics
          notebook_task:
            notebook_path: ../src/google_analytics.py

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
