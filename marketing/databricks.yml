# This is a Declarative Automation Bundle definition for marketing.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: marketing
  uuid: f9fd3cc7-b02a-4084-a0c6-32b8a89eb71c

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    presets:
      name_prefix: "dev_"
    default: true
    workspace:
      host: https://dbc-0744182d-1c29.cloud.databricks.com
    variables:
      catalog: dev_marketing_intelligence
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-0744182d-1c29.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ankit.velani@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ankit.velani@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_marketing_intelligence
      schema: bronze
    permissions:
      - user_name: ankit.velani@gmail.com
        level: CAN_MANAGE
